name: trazvalor-backup
services:
  db:
    image: postgres:16
    container_name: Trazvalor-backup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Cuiaba
    ports:
      # Acesso pelo host/DBeaver: localhost:${DB_PORT}. A 5432 do host é usada pelo ezway-db.
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    build: .
    image: trazvalor-backup:local
    container_name: Trazvalor-backup
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_DATA_PATH: /data
      BACKUP_APP_PATH: /var/www/html
      # Dentro da rede do Docker o banco é o serviço "db", porta interna 5432.
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8190}:80"
    volumes:
      - backup_data:/data
      - app_storage:/var/www/html/storage
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  worker:
    image: trazvalor-backup:local
    container_name: Trazvalor-backup-worker
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      BACKUP_DATA_PATH: /data
      BACKUP_APP_PATH: /var/www/html
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - backup_data:/data
      - worker_storage:/var/www/html/storage
      - ./certs:/certs:ro
      # Monte um destino remoto já configurado no host para habilitar a cópia externa:
      # - /mnt/backup-remoto:/external
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pg_data:
  backup_data:
  app_storage:
  worker_storage:
